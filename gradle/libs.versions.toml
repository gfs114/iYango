# iYango Android 版本目录（Version Catalog）
# 版本核对日期：2026-10-24，来源为阿里云 Maven 镜像实际可用版本。
# 约束：不使用动态版本号；升级依赖时逐项验证并更新本表。

[versions]
# AGP 9.4：内置 Kotlin（不再使用 org.jetbrains.kotlin.android 插件）。
# 2026 AndroidX 稳定线（Compose 1.12 / Navigation 2.10 / androidx.hilt 1.4）要求 AGP 9.1+。
agp = "9.4.0"
kotlin = "2.4.21"
ksp = "2.3.12"
coroutines = "1.11.0"
serializationJson = "1.12.0"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
navigationCompose = "2.10.2"
navigationEvent = "1.1.2"
hilt = "2.60.1"
hiltExt = "1.4.0"
room = "2.8.5"
datastore = "1.3.0"
coreKtx = "1.19.1"
okhttp = "5.5.1"
jsoup = "1.23.2"
junit = "4.13.2"
robolectric = "4.17"
turbine = "1.2.1"
# Kyant0/AndroidLiquidGlass（Backdrop 库，2.x）：液态玻璃材质，底部导航使用。
backdrop = "2.0.1"

[libraries]
# AndroidX 基础
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-navigationevent-compose = { group = "androidx.navigationevent", name = "navigationevent-compose", version.ref = "navigationEvent" }

# Compose（版本统一由 BOM 管理）
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons = { group = "androidx.compose.material", name = "material-icons-core" }

# 液态玻璃（https://github.com/Kyant0/AndroidLiquidGlass，Maven Central 坐标 io.github.kyant0:backdrop）
backdrop = { group = "io.github.kyant0", name = "backdrop", version.ref = "backdrop" }
# backdrop 的胶囊形状依赖（backdrop 以 implementation 引用，不传递，需显式声明）
kyant-shapes = { group = "io.github.kyant0", name = "shapes", version = "1.2.1" }

# Hilt 依赖注入
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltExt" }
hilt-android-testing = { group = "com.google.dagger", name = "hilt-android-testing", version.ref = "hilt" }

# Room 结构化存储
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }

# DataStore 偏好
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# 网络（P3 学校客户端使用，先入目录不引入模块）
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
jsoup = { group = "org.jsoup", name = "jsoup", version.ref = "jsoup" }

# Kotlin 库
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serializationJson" }

# 测试
junit = { group = "junit", name = "junit", version.ref = "junit" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
# AGP 9 起内置 Kotlin：kotlin-android 插件已移除。
# kotlin-jvm 仍用于纯 JVM 模块（core:model / core:domain）。
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
