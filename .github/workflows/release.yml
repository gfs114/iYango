name: Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android licenses
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --list_installed | grep -E "platforms;android-37|build-tools" | head -5

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.IYANGO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 IYANGO_KEYSTORE_BASE64，无法生成已签名 release APK"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build release
        env:
          IYANGO_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          IYANGO_KEYSTORE_PASSWORD: ${{ secrets.IYANGO_KEYSTORE_PASSWORD }}
          IYANGO_KEY_ALIAS: ${{ secrets.IYANGO_KEY_ALIAS }}
          IYANGO_KEY_PASSWORD: ${{ secrets.IYANGO_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-configuration-cache --stacktrace --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iYango-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Generate release notes & checksums
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import datetime
          import glob
          import hashlib
          import json
          import os
          import re
          import subprocess

          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["GITHUB_REF_NAME"]
          apks = sorted(glob.glob("app/build/outputs/apk/release/*.apk"))
          if not apks:
              raise SystemExit("No release APK found")

          checksum_lines = []
          table_rows = []
          for path in apks:
              name = os.path.basename(path)
              size_mb = os.path.getsize(path) / (1024 * 1024)
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              checksum_lines.append(f"{h.hexdigest()}  {name}")
              url = f"https://github.com/{repo}/releases/download/{tag}/{name}"
              table_rows.append(
                  f"| **Android 8.0+ (APK / 手机安装)** | [{name}]({url}) | {size_mb:.2f} MB |"
              )

          sums_path = "app/build/outputs/apk/release/SHA256SUMS.txt"
          with open(sums_path, "w", encoding="utf-8", newline="\n") as f:
              f.write("\n".join(checksum_lines) + "\n")

          def git(*args):
              return subprocess.run(
                  ["git", *args],
                  capture_output=True,
                  text=True,
                  encoding="utf-8",
              )

          prev_tag = ""
          res_prev = git("describe", "--tags", "--abbrev=0", f"{tag}^")
          if res_prev.returncode == 0:
              prev_tag = res_prev.stdout.strip()

          tag_msg = ""
          res_tag = git("tag", "-l", "--format=%(contents)", tag)
          if res_tag.returncode == 0:
              raw_tag = res_tag.stdout.strip()
              non_empty = [ln.strip() for ln in raw_tag.splitlines() if ln.strip()]
              is_stub = (
                  len(non_empty) == 1
                  and re.match(r"^(release\s+v?\S*|v?\d+(\.\d+)*)$", non_empty[0], re.I) is not None
              )
              if non_empty and not is_stub:
                  tag_msg = raw_tag

          changelog_lines = []
          if tag_msg:
              changelog_lines.append(tag_msg)
          else:
              args = ["log", "--no-merges", "--format=%x1e%s%x1f%b"]
              if prev_tag:
                  args.append(f"{prev_tag}..{tag}")
              else:
                  args.extend(["-n", "20", tag])
              res_log = git(*args)
              groups = {"新增": [], "修复": [], "优化": [], "其他": []}
              skipped = []
              for rec in res_log.stdout.split("\x1e"):
                  rec = rec.strip("\n\r")
                  if not rec:
                      continue
                  subject, _, body = rec.partition("\x1f")
                  subject = subject.strip()
                  if not subject:
                      continue
                  m = re.match(r"^([a-zA-Z]+)(?:\([^)]*\))?:\s*(.+)$", subject)
                  prefix = m.group(1).lower() if m else ""
                  clean_subject = m.group(2).strip() if m else subject
                  bullets = [
                      "- " + re.sub(r"^[-*]\s+", "", ln.strip())
                      for ln in body.splitlines()
                      if re.match(r"^\s*[-*]\s+\S+", ln)
                  ]
                  items = bullets if bullets else [f"- {clean_subject}"]
                  if prefix == "feat":
                      groups["新增"].extend(items)
                  elif prefix == "fix":
                      groups["修复"].extend(items)
                  elif prefix in ("perf", "refactor", "style"):
                      groups["优化"].extend(items)
                  elif prefix in ("ci", "chore", "docs", "test", "build"):
                      skipped.extend(items)
                  else:
                      groups["其他"].extend(items)

              has_primary = any(groups[k] for k in ("新增", "修复", "优化", "其他"))
              if not has_primary and skipped:
                  groups["其他"].extend(skipped)

              for title in ("新增", "修复", "优化", "其他"):
                  if groups[title]:
                      changelog_lines.append(f"### {title}")
                      changelog_lines.extend(groups[title])
                      changelog_lines.append("")

          sums_url = f"https://github.com/{repo}/releases/download/{tag}/SHA256SUMS.txt"
          out = [
              "## Download / 下载",
              "",
              "| System / 系统 | Download / 下载 | Size / 大小 |",
              "| :--- | :--- | :--- |",
              *table_rows,
              "",
              f"下载后可使用 [SHA256SUMS.txt]({sums_url}) 核对安装包 SHA-256 校验值。",
              "",
              "## 更新内容",
              "",
              *changelog_lines,
          ]
          if prev_tag:
              if out and out[-1] != "":
                  out.append("")
              out.append(f"**Full Changelog**: https://github.com/{repo}/compare/{prev_tag}...{tag}")

          with open("release-notes.md", "w", encoding="utf-8", newline="\n") as f:
              f.write("\n".join(out).rstrip() + "\n")

          primary_apk = apks[0]
          primary_name = os.path.basename(primary_apk)
          version_code = 0
          gradle_path = "app/build.gradle.kts"
          if os.path.isfile(gradle_path):
              with open(gradle_path, "r", encoding="utf-8") as gf:
                  m_vc = re.search(r"\bversionCode\s*=\s*(\d+)", gf.read())
                  if m_vc:
                      version_code = int(m_vc.group(1))
          manifest_obj = {
              "versionCode": version_code,
              "versionName": tag.lstrip("vV"),
              "releaseNotes": "\n".join(changelog_lines).strip(),
              "downloadUrl": f"https://github.com/{repo}/releases/download/{tag}/{primary_name}",
              "pageUrl": f"https://github.com/{repo}/releases/tag/{tag}",
              "publishedAt": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "apkSizeBytes": os.path.getsize(primary_apk),
              "apkFileName": primary_name,
              "forceUpdate": False,
          }
          manifest_path = "app/build/outputs/apk/release/update-manifest.json"
          with open(manifest_path, "w", encoding="utf-8", newline="\n") as mf:
              json.dump(manifest_obj, mf, ensure_ascii=False, indent=2)
              mf.write("\n")
          PY

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
            app/build/outputs/apk/release/update-manifest.json
          generate_release_notes: false
