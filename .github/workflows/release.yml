name: Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android licenses
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --list_installed | grep -E "platforms;android-37|build-tools" | head -5

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.IYANGO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 IYANGO_KEYSTORE_BASE64，无法生成已签名 release APK"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build release
        env:
          IYANGO_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          IYANGO_KEYSTORE_PASSWORD: ${{ secrets.IYANGO_KEYSTORE_PASSWORD }}
          IYANGO_KEY_ALIAS: ${{ secrets.IYANGO_KEY_ALIAS }}
          IYANGO_KEY_PASSWORD: ${{ secrets.IYANGO_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-configuration-cache --stacktrace --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iYango-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
